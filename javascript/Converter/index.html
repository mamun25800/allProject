<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <div class="screen">
            <h4 id="heading">Metric/Imperial Unit Conversion</h4>
            <input type="text" placeholder="0" id="unit">
            <button id="btn">CONVERT</button>
        </div>
        <div class="data">
            <div class="length">
                <h4 id="ki">Length (Meter/Feet)</h4>
                <p id="length"></p>
            </div>
            <div class="volume">
                <h4 id="ki">Volume (Meter/Feet)</h4>
                <p id="volume"></p>
            </div>
            <div class="mass">
                <h4 id="ki">Mass (Meter/Feet)</h4>
                <p id="mass"></p>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
